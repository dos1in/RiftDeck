name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Stable version (major.minor.patch)
        type: string
        required: true
      versionCode:
        description: Android version code, greater than every previous release
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.versionName }}
      RELEASE_CODE: ${{ inputs.versionCode }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})', os.environ['RELEASE_VERSION']), 'Use major.minor.patch'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['RELEASE_CODE']), 'Use a positive version code'
          assert 1 <= int(os.environ['RELEASE_CODE']) <= 2100000000, 'Invalid Android version code'
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test release version validation
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Verify versions exceed published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/validate_release.py --repository "$GITHUB_REPOSITORY" \
            --version-name "$RELEASE_VERSION" --version-code "$RELEASE_CODE" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RIFTDECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure RIFTDECK_KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/riftdeck-release.jks"
      - name: Test and build signed APK
        env:
          RIFTDECK_SIGNING_KEYSTORE: ${{ runner.temp }}/riftdeck-release.jks
          RIFTDECK_SIGNING_STORE_PASSWORD: ${{ secrets.RIFTDECK_SIGNING_STORE_PASSWORD }}
          RIFTDECK_SIGNING_KEY_ALIAS: ${{ secrets.RIFTDECK_SIGNING_KEY_ALIAS }}
          RIFTDECK_SIGNING_KEY_PASSWORD: ${{ secrets.RIFTDECK_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PappVersionName="$RELEASE_VERSION" -PappVersionCode="$RELEASE_CODE" --no-daemon --console=plain
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          name="RiftDeck-v${RELEASE_VERSION}.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          gh release create "v${RELEASE_VERSION}" "$RUNNER_TEMP/$name" --target "$GITHUB_SHA" --title "RiftDeck ${RELEASE_VERSION}" --generate-notes --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/riftdeck-release.jks"
