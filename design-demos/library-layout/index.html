<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiftDeck · 游戏库排列对比</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b0c;color:#eef5f3;font:16px system-ui,sans-serif}header{max-width:1120px;margin:28px auto 18px;padding:0 22px}h1{font-size:26px;margin:0 0 8px}p{color:#a5b6b8;margin:0;line-height:1.6}nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button{background:#142023;color:#eef5f3;border:1px solid #34484b;padding:12px 20px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#f8f800;color:#f8f800}button:focus-visible{outline:2px solid #00f0f0;outline-offset:3px}main{max-width:1120px;margin:auto;padding:0 22px}iframe{display:block;width:100%;height:min(76vw,760px);min-height:420px;border:1px solid #34484b;background:#000}#description{padding:16px 0}a{color:#00f0f0}</style>
<header><h1>游戏库 · 三种排列</h1><p>同一套暗色风格，比较浏览密度、预览大小和方向键操作。示例封面仅用于排列对比。</p><nav><button aria-pressed="true" data-mode="A">A · 列表与大预览</button><button aria-pressed="false" data-mode="B">B · 封面网格</button><button aria-pressed="false" data-mode="C">C · 画面与封面带</button></nav></header><main><iframe title="游戏库排列原型" src="A.html"></iframe><p id="description"></p></main>
<script>const copy={A:'按名称快速找游戏：窄列表保留更多条目，右侧固定大预览。',B:'按封面辨认游戏：用网格直接浏览，底部统一显示当前游戏和操作。',C:'先看画面再选游戏：大预览占主位，下方左右切换封面。'};function select(mode){document.querySelector('iframe').src=mode+'.html';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#description').textContent=copy[mode]}document.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.mode));document.querySelector('#description').textContent=copy.A;</script></html>
