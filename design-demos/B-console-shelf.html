Only behavior is referenced. All colors, icon paths and geometric placeholder covers come from RiftDeck's shared design input.

<script>
'use strict';
const shared=JSON.parse(document.getElementById('shared-data').textContent);
const games=shared.games.map(g=>({...g}));
const $=s=>document.querySelector(s), main=$('#main'), dialog=$('#dialog');
const state={screen:'home',selected:1,category:'all',sort:'original',search:'',setting:'library',empty:false,reduced:false,history:[],positions:{},savedFocus:{},dialogReturn:null};
try{const saved=JSON.parse(localStorage.getItem('riftdeck-b')||'null');if(saved&&typeof saved==='object'){state.reduced=saved.reduced===true;if(Array.isArray(saved.favorites))games.forEach(g=>g.favorite=saved.favorites.includes(g.id));}}catch{}
document.body.classList.toggle('reduced',state.reduced);$('#brand-logo').src=shared.logo;
const gameById=id=>games.find(g=>g.id===Number(id))||games[0];
const time=s=>{let m=Math.round(s/60),h=Math.floor(m/60);return h?`${h} 小时 ${m%60} 分`:`${m} 分`;};
const favCount=()=>games.filter(g=>g.favorite).length;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=v=>`<span class="key${v.length>1?' wide':''}">${v}</span>`;
function persist(){try{localStorage.setItem('riftdeck-b',JSON.stringify({reduced:state.reduced,favorites:games.filter(g=>g.favorite).map(g=>g.id)}));}catch{}}
function visibleGames(){let list=games.filter(g=>(state.category==='favorites'?g.favorite:state.category==='recent'?g.id<=3:true)&&g.title.toLowerCase().includes(state.search.toLowerCase().trim()));if(state.sort!=='original')list.sort((a,b)=>state.sort==='az'?a.title.localeCompare(b.title):b.title.localeCompare(a.title));return list;}
function card(g,index){return `<button id="game-${g.id}" class="game-card${state.selected===g.id?' selected':''}" data-action="details" data-game-id="${g.id}" aria-label="${g.title}，${g.genre}${g.favorite?'，已收藏':''}"><div class="cover"><img src="${g.cover}" alt="${g.title} 示例封面" draggable="false">${g.favorite?'<span class="favorite-flag" aria-hidden="true">★</span>':''}<span class="selection-mark"></span></div><span class="game-title">${g.title}</span><span class="card-note"><span>${state.screen==='home'?g.lastPlayed:g.genre}</span><span>示例封面</span></span></button>`;}
function selectionInfo(){let g=gameById(state.selected);return `<div class="selection-lead"><div class="selection-index">${String(g.id).padStart(2,'0')}</div><div class="selection-copy"><h2>${g.title}</h2><p>${g.genre} · ${g.year} · ${g.developer}</p></div></div><div class="selection-right"><div class="time-meta">游玩时长<strong>${time(g.playTimeSeconds)}</strong></div><button class="text-action" id="home-detail" data-action="details" data-game-id="${g.id}">查看详情 <span class="arrow">↗</span></button></div>`;}
function homeView(){return `<section class="screen home-screen"><div class="heading"><div><p class="eyebrow">Game Boy Advance</p><h1>继续游玩</h1></div><span class="heading-note">你的游戏，一直在这里。</span></div><div class="shelf-wrap" id="shelf-scroll"><div class="shelf">${games.map(card).join('')}</div></div><div class="selection-info" id="selection-info">${selectionInfo()}</div><div class="shortcuts"><button class="shortcut" id="shortcut-recent" data-action="recent"><strong>最近玩过</strong><span>03 →</span></button><button class="shortcut" id="shortcut-favorites" data-action="favorites"><strong>我的收藏</strong><span>${String(favCount()).padStart(2,'0')} →</span></button><button class="text-action" id="shortcut-library" data-action="library">全部游戏 <span class="arrow">→</span></button><span class="shelf-caption">GBA · ${games.length} 款游戏</span></div></section>`;}
function libraryView(){let list=visibleGames();return `<section class="screen library-screen"><div class="heading"><div><p class="eyebrow">Game Boy Advance</p><h1>游戏库 <span class="count">${list.length} 款</span></h1></div><span class="heading-note">封面之间，就是下一场游戏。</span></div><div class="library-tools"><div class="filters" role="group" aria-label="游戏分类">${[['all','全部',5],['recent','最近',3],['favorites','收藏',favCount()]].map(([c,t,n])=>`<button class="filter${state.category===c?' active':''}" id="filter-${c}" data-action="filter" data-value="${c}" aria-pressed="${state.category===c}">${t}<small>${n}</small></button>`).join('')}</div><input class="search" id="search" type="search" placeholder="搜索游戏" aria-label="搜索游戏" value="${escapeHtml(state.search)}"><button class="sort" id="sort" data-action="sort">${state.sort==='original'?'书架顺序':state.sort==='az'?'标题 A → Z':'标题 Z → A'} ⇅</button></div><div class="library-grid" id="library-grid">${list.length?list.map(card).join(''):`<div class="empty-result"><h2>${state.search?'没有找到匹配的游戏':'这里还没有收藏'}</h2><p>${state.search?'换个标题试试。':'选中一款游戏，按 Y 加入收藏。'}</p><button class="secondary" id="clear-filter" data-action="clear-filter">显示全部游戏</button></div>`}</div><div class="library-foot"><span>GBA / ${state.category==='all'?'全部游戏':state.category==='recent'?'最近玩过':'我的收藏'}</span><span>Q / E 切换分类</span></div></section>`;}
function detailView(){let g=gameById(state.selected);return `<section class="screen detail-screen"><div class="backline"><button id="detail-back" data-action="back">← 返回书架</button><span>/</span><span>GBA</span></div><div class="detail-layout"><div><div class="detail-art"><img src="${g.cover}" alt="${g.title} 示例封面"></div><div class="detail-art-note"><span>示例封面</span><span>GAME BOY ADVANCE</span></div></div><div class="detail-copy"><p class="eyebrow">Game Boy Advance</p><h1>${g.title}</h1><div class="detail-tags"><span>${g.genre}</span><span>${g.year}</span><span>${g.favorite?'★ 已收藏':'未收藏'}</span></div><div class="detail-stats"><dl><dt>游玩时长</dt><dd>${time(g.playTimeSeconds)}</dd></dl><dl><dt>上次游玩</dt><dd>${g.lastPlayed}</dd></dl></div><div class="detail-actions"><button id="play" class="primary" data-action="launch" data-game-id="${g.id}">${key('A')} 开始游戏 <span>↗</span></button><button id="favorite" class="secondary" data-action="favorite" data-game-id="${g.id}" aria-pressed="${g.favorite}">${g.favorite?'★ 已收藏':'☆ 收藏'} <span aria-hidden="true">Y</span></button></div><p class="detail-line">从书架出发，随时回来。</p><dl class="metadata"><dt>制作方</dt><dd>${g.developer}</dd><dt>平台</dt><dd>Game Boy Advance</dd></dl></div></div></section>`;}
const settingLabels={library:'游戏库',emulators:'模拟器',appearance:'外观',input:'输入',video:'视频预览',performance:'性能'};
function settingPanel(){switch(state.setting){case 'library':return `<h2>游戏库</h2><p>将你的游戏，放到同一个书架。</p><div class="setting-row"><div><strong>ROM 文件夹</strong><p>添加保存 GBA 游戏的本地目录。</p></div><button id="add-folder" class="secondary" data-action="folder">添加文件夹</button></div><div class="setting-row"><div><strong>当前内容</strong><p>${state.empty?'空库预览，未连接设备存储。':'5 款示例游戏 · Game Boy Advance'}</p></div><span class="state-text">交互初稿</span></div>`;case 'emulators':return `<h2>模拟器</h2><p>为 GBA 指定一个外部模拟器。</p><div class="setting-row"><div><strong>Game Boy Advance</strong><p>尚未配置模拟器</p></div><button class="secondary" id="configure-emulator" data-action="configure">配置</button></div><div class="setting-row"><p>启动游戏前，需要在 Android 设备上安装并配置模拟器。本初稿只演示配置入口。</p></div>`;case 'appearance':return `<h2>外观</h2><p>清楚的焦点，恰到好处的动态。</p><div class="setting-row"><div><strong>主题</strong><p>RiftDeck Neon · 当前主题</p></div><span class="state-text">霓虹黄</span></div><div class="setting-row"><div><strong>降低动态效果</strong><p>关闭封面焦点的缩放过渡。</p></div><button id="reduced-motion" class="toggle" data-action="reduce" role="switch" aria-label="降低动态效果" aria-checked="${state.reduced}"></button></div>`;case 'input':return `<h2>输入</h2><p>键盘模拟掌机按键。可使用方向键完成整个流程。</p><div class="input-table">${[['↑ ↓ ← →','移动焦点'],['Enter / A','确认'],['Esc / B','返回'],['X','游戏详情'],['Y','收藏 / 取消'],['Q / E','切换分类'],['M','打开设置']].map(([k,v])=>`<div class="input-pair"><span>${k}</span><span>${v}</span></div>`).join('')}</div><div class="setting-row"><p>按键重映射将在 Android 版本中配置。</p></div>`;case 'video':return `<h2>视频预览</h2><p>停留片刻，再进入游戏的世界。</p><div class="setting-row"><div><strong>自动预览</strong><p>当前示例没有视频资源，预览保持关闭。</p></div><span class="state-text">关闭</span></div><div class="setting-row"><p>原生版本将支持延迟播放，并在焦点离开时立即停止。</p></div>`;case 'performance':return `<h2>性能</h2><p>让每一次按键，都得到清楚的回应。</p><div class="setting-row"><div><strong>封面资源</strong><p>本初稿使用本地内嵌的轻量示例封面。</p></div><span class="state-text">离线</span></div><div class="setting-row"><div><strong>设备性能设置</strong><p>将在 Android 版本上结合实际设备测试开放。</p></div></div>`;}}
function settingsView(){return `<section class="screen settings-screen"><div class="heading"><div><p class="eyebrow">Make it yours</p><h1>设置</h1></div><button id="settings-back" class="text-action" data-action="back">← 返回</button></div><div class="settings-layout"><nav class="settings-nav" aria-label="设置分类">${Object.entries(settingLabels).map(([id,label])=>`<button id="setting-${id}" class="setting-tab${state.setting===id?' active':''}" data-action="setting" data-value="${id}" aria-current="${state.setting===id?'page':'false'}">${label}</button>`).join('')}</nav><div class="settings-panel">${settingPanel()}</div></div></section>`;}
function emptyView(){return `<section class="screen empty-screen"><div class="empty-platform"><p class="eyebrow">Game Boy Advance</p><span class="count">0 款游戏</span></div><div class="empty-main"><div class="empty-cartridge" aria-hidden="true"></div><h1>暂无游戏</h1><p>把 GBA 游戏放进书架，<br>下一次开机，就能从这里开始。</p><button id="empty-add" class="primary" data-action="empty-folder">${key('A')} 添加 ROM 文件夹</button><div class="empty-foot">支持 .gba · 文件保留在你的设备上</div></div></section>`;}
function updateHints(){const detail=state.screen==='detail',settings=state.screen==='settings';$('#hints').innerHTML=`<span class="hint">${key('A')}${detail?'开始游戏':'确认'}</span><span class="hint">${key('B')}返回</span>${settings?'':`<span class="hint">${key('Y')}收藏</span>`}<span class="hint optional">${key(settings?'↑↓':'Q/E')}${settings?'选择设置':'切换分类'}</span><span class="hint optional">${key('M')}设置</span>`;$('#review-state').textContent=state.empty?'恢复示例库':'查看空库';}
function render(focusId){document.body.dataset.screen=state.screen;$('#nav-home').classList.toggle('active',state.screen==='home');$('#nav-library').classList.toggle('active',state.screen==='library'||state.screen==='detail');$('#nav-settings').classList.toggle('active',state.screen==='settings');main.innerHTML=state.empty&&state.screen!=='settings'?emptyView():state.screen==='home'?homeView():state.screen==='library'?libraryView():state.screen==='detail'?detailView():settingsView();updateHints();requestAnimationFrame(()=>{if(focusId&&document.getElementById(focusId))focusElement(document.getElementById(focusId));else focusElement(main.querySelector(state.empty&&state.screen!=='settings'?'#empty-add':state.screen==='detail'?'#play':state.screen==='settings'?`.setting-tab.active`:'.game-card')||main.querySelector('button'));});}
function recordPosition(){state.savedFocus[state.screen]=document.activeElement?.id;state.positions[state.screen]={top:main.scrollTop,shelf:$('#shelf-scroll')?.scrollLeft||0};}
function go(screen,options={}){recordPosition();if(state.screen!==screen&&!options.replace)state.history.push({screen:state.screen,focus:state.savedFocus[state.screen],category:state.category,search:state.search,sort:state.sort});state.screen=screen;render(options.focus);main.scrollTop=0;}
function back(){if(dialog.open){closeDialog();return;}if(state.history.length){const previous=state.history.pop();state.screen=previous.screen;state.category=previous.category;state.search=previous.search;state.sort=previous.sort;render(previous.focus);requestAnimationFrame(()=>{const p=state.positions[state.screen];if(p){main.scrollTop=p.top;if($('#shelf-scroll'))$('#shelf-scroll').scrollLeft=p.shelf;}});}else if(state.screen!=='home'){state.screen='home';render(`game-${state.selected}`);}}
function focusElement(el){if(!el)return;el.focus({preventScroll:true});ensureVisible(el);}
function ensureVisible(el){const shelf=el.closest('.shelf-wrap');if(shelf){const a=el.getBoundingClientRect(),b=shelf.getBoundingClientRect(),pad=24;if(a.left<b.left+pad)shelf.scrollLeft-=b.left+pad-a.left;if(a.right>b.right-pad)shelf.scrollLeft+=a.right-(b.right-pad);}else if(main.contains(el)){const a=el.getBoundingClientRect(),b=main.getBoundingClientRect();if(a.top<b.top+12)main.scrollTop-=b.top+12-a.top;if(a.bottom>b.bottom-12)main.scrollTop+=a.bottom-(b.bottom-12);}}
function announce(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2200);}
function toggleFavorite(){if(state.screen==='library'&&!visibleGames().some(g=>g.id===state.selected))return;const g=gameById(state.selected);g.favorite=!g.favorite;persist();const id=document.activeElement?.id;const p={top:main.scrollTop,shelf:$('#shelf-scroll')?.scrollLeft};render(id);requestAnimationFrame(()=>{main.scrollTop=p.top;if($('#shelf-scroll'))$('#shelf-scroll').scrollLeft=p.shelf;});announce(g.favorite?'已加入收藏':'已取消收藏');}
function openDialog(title,copy,primaryLabel='知道了',primaryAction='close-dialog'){state.dialogReturn=document.activeElement?.id;$('#dialog-title').textContent=title;$('#dialog-copy').textContent=copy;$('#dialog-actions').innerHTML=`<button class="primary" id="dialog-primary" data-action="${primaryAction}">${primaryLabel}</button>${primaryAction!=='close-dialog'?'<button class="secondary" data-action="close-dialog">返回</button>':''}`;dialog.showModal();focusElement($('#dialog-primary'));}
function closeDialog(){dialog.close();focusElement(document.getElementById(state.dialogReturn));}
function setCategory(category){state.category=category;if(state.screen!=='library')go('library');else render(`filter-${category}`);}
function action(el){const name=el.dataset.action;if(el.dataset.gameId)state.selected=Number(el.dataset.gameId);switch(name){case 'home':go('home');break;case 'library':state.category='all';state.search='';go('library');break;case 'settings':go('settings');break;case 'details':if(state.empty)return;go('detail');break;case 'recent':setCategory('recent');break;case 'favorites':setCategory('favorites');break;case 'filter':state.category=el.dataset.value;render(el.id);break;case 'sort':state.sort=state.sort==='original'?'az':state.sort==='az'?'za':'original';render('sort');break;case 'clear-filter':state.category='all';state.search='';render();break;case 'favorite':toggleFavorite();break;case 'back':back();break;case 'launch':openDialog('尚未配置模拟器','需要先在 Android 设备上安装并配置 GBA 模拟器，才能开始游戏。当前为交互初稿。','前往模拟器设置','emulator-settings');break;case 'emulator-settings':closeDialog();state.setting='emulators';go('settings');break;case 'setting':state.setting=el.dataset.value;render(el.id);break;case 'folder':openDialog('添加 ROM 文件夹','此 HTML 初稿无法访问设备目录。Android 版本会打开系统文件夹选择器，并保留你授权的访问权限。');break;case 'empty-folder':state.setting='library';go('settings',{focus:'add-folder'});requestAnimationFrame(()=>openDialog('添加 ROM 文件夹','此 HTML 初稿无法访问设备目录。你可以在这里预览添加入口，Android 版本将通过系统选择器添加 ROM 文件夹。'));break;case 'configure':openDialog('在设备上配置模拟器','此初稿不读取已安装的应用。Android 版本将在这里选择外部模拟器并完成启动参数配置。');break;case 'reduce':state.reduced=!state.reduced;document.body.classList.toggle('reduced',state.reduced);persist();render('reduced-motion');break;case 'toggle-empty':state.empty=!state.empty;state.history=[];state.screen='home';render();break;case 'close-dialog':closeDialog();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)action(b);});
document.addEventListener('focusin',e=>{const card=e.target.closest('.game-card');if(card){state.selected=Number(card.dataset.gameId);document.querySelectorAll('.game-card').forEach(el=>el.classList.toggle('selected',el===card));if($('#selection-info'))$('#selection-info').innerHTML=selectionInfo();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;state.search=e.target.value;render('search');requestAnimationFrame(()=>{try{$('#search')?.setSelectionRange(start,start);}catch{}});}});
function focusables(){const root=dialog.open?dialog:$('#app');return [...root.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(el=>el.getClientRects().length&&!el.hidden);}
function move(direction){const current=document.activeElement;
if(!dialog.open&&state.screen==='settings'){
 const tabs=[...document.querySelectorAll('.setting-tab')],i=tabs.indexOf(current);
 if(i>=0&&direction==='right'){focusElement(document.querySelector('.settings-panel button'));return}
 if(i>=0&&(direction==='up'||direction==='down')){focusElement(tabs[i+(direction==='up'?-1:1)]);return}
 if(current.closest('.settings-panel')&&direction==='left'){focusElement(document.querySelector('.setting-tab.active'));return}
}
if(!dialog.open&&state.screen==='library'&&current.matches('.game-card')){
 const grid=current.closest('.library-grid'),cards=[...grid.querySelectorAll('.game-card')],i=cards.indexOf(current),cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
 const target=direction==='right'?(i%cols<cols-1?cards[i+1]:null):direction==='left'?(i%cols>0?cards[i-1]:null):direction==='down'?cards[i+cols]:(i>=cols?cards[i-cols]:$('#filter-all'));
 focusElement(target);return;
}
const candidates=focusables().filter(el=>el.id!=='review-state');if(!candidates.includes(current)){focusElement(candidates[0]);return;}const index=candidates.indexOf(current),card=current.closest('.game-card');if(card&&(direction==='left'||direction==='right')){const cards=[...main.querySelectorAll('.game-card')];const next=cards[cards.indexOf(card)+(direction==='left'?-1:1)];if(next){focusElement(next);return;}if(state.screen==='home')return;}
 const a=current.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,score=Infinity;
 for(const item of candidates){if(item===current)continue;const b=item.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay;let primary,cross;if(direction==='left'||direction==='right'){if((direction==='left'&&dx>=-4)||(direction==='right'&&dx<=4))continue;primary=Math.abs(dx);cross=Math.abs(dy);}else{if((direction==='up'&&dy>=-4)||(direction==='down'&&dy<=4))continue;primary=Math.abs(dy);cross=Math.abs(dx);}const value=primary+cross*2.8;if(value<score){score=value;best=item;}}if(best)focusElement(best);}
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,[contenteditable="true"]');if(typing){if(e.key==='Escape'){e.preventDefault();focusElement(main.querySelector('.game-card')||$('#filter-all'));}else if(e.key==='ArrowDown'){e.preventDefault();focusElement(main.querySelector('.game-card')||$('#clear-filter'));}return;}if(e.key==='Tab'&&dialog.open){e.preventDefault();const list=focusables(),index=list.indexOf(document.activeElement);focusElement(list[(index+(e.shiftKey?-1:1)+list.length)%list.length]);return;}
 const k=e.key.toLowerCase(),directions={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'};if(e.repeat&&!directions[k]){e.preventDefault();return;}if(directions[k]){e.preventDefault();move(directions[k]);return;}if(k==='enter'||k==='a'){e.preventDefault();document.activeElement?.click();return;}if(k==='escape'||k==='b'){e.preventDefault();back();return;}if(dialog.open)return;if(k==='x'&&!state.empty&&['home','library'].includes(state.screen)){e.preventDefault();go('detail');}else if(k==='y'&&!state.empty&&['home','library','detail'].includes(state.screen)){e.preventDefault();toggleFavorite();}else if(k==='m'){e.preventDefault();if(state.screen!=='settings')go('settings');}else if((k==='q'||k==='e')&&!state.empty&&['home','library'].includes(state.screen)){e.preventDefault();const categories=['all','recent','favorites'],i=categories.indexOf(state.category);setCategory(categories[(i+(k==='q'?-1:1)+3)%3]);}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
window.addEventListener('error',()=>{const toast=$('#toast');if(toast){toast.textContent='页面遇到问题，请刷新后重试。';toast.hidden=false;}});
render('game-1');
</script>
</body>
</html>
