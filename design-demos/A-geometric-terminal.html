<script>
'use strict';
const data=JSON.parse(document.getElementById('mock-data').textContent);
const storeKey='riftdeck-geometric-terminal-v1';
const defaults={screen:'home',selected:1,filter:'all',sortAsc:true,section:'library',empty:false,reduced:false,favorites:[1,3],focusByPage:{},scrollByPage:{},history:[]};
let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){}
const state={...defaults,...saved};
if(!['home','library','detail','settings'].includes(state.screen))state.screen='home';
if(!data.games.some(g=>g.id===state.selected))state.selected=1;
if(!['all','favorites','recent'].includes(state.filter))state.filter='all';
if(!['library','emulators','appearance','input','video','performance'].includes(state.section))state.section='library';
state.favorites=Array.isArray(state.favorites)?state.favorites.filter(id=>data.games.some(g=>g.id===id)):[1,3];
state.history=Array.isArray(state.history)?state.history.filter(p=>p&&['home','library','detail','settings'].includes(p.screen)).slice(-20):[];
state.focusByPage=state.focusByPage&&typeof state.focusByPage==='object'?state.focusByPage:{};
state.scrollByPage=state.scrollByPage&&typeof state.scrollByPage==='object'?state.scrollByPage:{};
state.screen='home';state.history=[];state.empty=false;
state.focusByPage.home='home-game-1';state.scrollByPage.home=0;
state.reduced=state.reduced===true;state.sortAsc=state.sortAsc!==false;
const main=document.getElementById('main'),modal=document.getElementById('modal');
let modalReturn=null,toastTimer;
const game=()=>data.games.find(g=>g.id===state.selected)||data.games[0];
const favorited=id=>state.favorites.includes(id);
const playtime=g=>{let h=Math.floor(g.playTimeSeconds/3600),m=Math.floor(g.playTimeSeconds%3600/60);return(h?h+' 小时 ':'')+m+' 分'};
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
function notify(message){clearTimeout(toastTimer);let t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');toastTimer=setTimeout(()=>t.classList.add('hidden'),2200)}
function cover(g,extra=''){return `<div class="cover-wrap ${extra}"><img src="${g.cover}" alt="${g.title} 示例封面"><span class="cover-note">示例封面</span>${favorited(g.id)?'<span class="cover-star" aria-label="已收藏">★</span>':''}</div>`}
function buttonGame(g,cls='game-tile'){return `<button class="${cls}" id="game-${g.id}" data-game-id="${g.id}" data-action="detail" aria-label="${g.title}，${g.genre}${favorited(g.id)?'，已收藏':''}">${cover(g)}<strong>${g.title}</strong><div class="tile-meta"><span>${g.genre} / ${g.year}</span><span>${favorited(g.id)?'★ 收藏':''}</span></div></button>`}
function remember(){const f=document.activeElement;if(f&&f.id)state.focusByPage[state.screen]=f.id;state.scrollByPage[state.screen]=main.scrollTop;persist()}
function go(screen,options={}){if(screen!==state.screen){remember();state.history.push({screen:state.screen,filter:state.filter,section:state.section,selected:state.selected});state.history=state.history.slice(-20)}Object.assign(state,options);state.screen=screen;render()}
function back(){if(!modal.classList.contains('hidden')){closeModal();return}remember();const prev=state.history.pop();if(prev){Object.assign(state,prev);render()}else if(state.screen!=='home'){state.screen='home';render()}else notify('已在首页')}
function heading(title,label,extra=''){return `<div class="heading"><div><div class="eyebrow">${label}</div><h1>${title}</h1></div>${extra}</div>`}
function emptyScreen(){return `${heading('我的游戏库','LIBRARY / GBA')}<div class="empty-state"><div class="empty-mark" aria-hidden="true"></div><h1>暂无游戏</h1><p>添加一个 ROM 文件夹，开始整理你的游戏。</p><button class="primary-button" data-action="folder" id="add-folder">添加 ROM 文件夹 <span class="button-key">A</span></button><button class="text-link" data-action="empty">返回示例游戏库</button></div>`}
function home(){const g=data.games[0];return `${heading('继续游玩','HOME / YOUR LAST SESSION','<div class="side-caption">上次游玩 <span>1 小时前</span></div>')}<div class="home-stage"><button class="featured" id="home-game-1" data-action="detail" data-game-id="1">${cover(g)}<div class="featured-copy"><div class="index">GAME BOY ADVANCE</div><div class="game-title">Golden<br>Circuit</div><div class="genre">动作 / 2003</div><div class="playtime">已游玩 ${playtime(g)}</div><div class="open-game"><span class="arrow">↗</span>打开游戏 <span class="button-key">A</span></div></div></button><div class="home-links"><button class="collection-link" id="all-games" data-action="collection" data-filter="all"><span class="count">05</span><span class="link-label">全部游戏</span><span class="mini-arrow">↗</span></button><button class="collection-link favorites" id="home-favorites" data-action="collection" data-filter="favorites"><span class="count">${String(state.favorites.length).padStart(2,'0')}</span><span class="link-label">我的收藏</span><span class="mini-arrow">↗</span></button></div></div><div class="section-heading"><h2>最近游玩</h2><button class="text-link" id="recent-filter" data-action="collection" data-filter="recent">查看最近 3 款 →</button></div><div class="recent-list">${data.games.slice(0,3).map(g=>`<button class="recent-item" id="recent-game-${g.id}" data-action="detail" data-game-id="${g.id}"><img src="${g.cover}" alt="${g.title} 示例封面"><div class="recent-copy"><strong>${g.title}</strong><small>${g.lastPlayed}${favorited(g.id)?' · ★':''}</small></div></button>`).join('')}</div>`}
function library(){let games=data.games.filter(g=>state.filter==='favorites'?favorited(g.id):state.filter==='recent'?g.id<=3:true).sort((a,b)=>state.sortAsc?a.title.localeCompare(b.title):b.title.localeCompare(a.title));return `${heading('游戏库','LIBRARY / GAME BOY ADVANCE',`<div class="side-caption"><span>${games.length}</span> 款游戏</div>`)}<div class="toolbar"><div class="filter-group" aria-label="游戏分类">${[['all','全部'],['recent','最近'],['favorites','收藏']].map(([key,label])=>`<button class="filter" id="filter-${key}" data-action="filter" data-filter="${key}" aria-pressed="${state.filter===key}">${label}</button>`).join('')}</div><button class="sort-button" id="sort" data-action="sort">标题 ${state.sortAsc?'A → Z':'Z → A'} ⇅</button></div>${games.length?`<div class="library-grid">${games.map(g=>buttonGame(g)).join('')}</div>`:'<div class="library-empty"><h2>还没有收藏</h2><p class="muted">选中游戏，按 Y 添加收藏。</p><button class="secondary-button" data-action="filter" data-filter="all" id="show-all">浏览全部游戏</button></div>'}`}
function detail(){const g=game();const previous=state.history[state.history.length-1]?.screen;const backLabel=previous==='home'?'返回首页':previous==='settings'?'返回设置':'返回游戏库';return `<div class="detail-heading"><button class="back-button" id="detail-back" data-action="back">← ${backLabel}</button></div><div class="detail-layout">${cover(g,'detail-art')}<div class="detail-panel"><div class="detail-platform">GAME BOY ADVANCE / ${String(g.id).padStart(2,'0')}</div><h1>${g.title}</h1><p class="description">${g.genre} · ${g.year}</p><dl class="metadata"><div><dt>制作方</dt><dd>${g.developer}</dd></div><div><dt>游玩时长</dt><dd>${playtime(g)}</dd></div><div><dt>上次游玩</dt><dd>${g.lastPlayed}</dd></div><div><dt>平台</dt><dd>Game Boy Advance</dd></div></dl><div class="actions"><button class="primary-button" id="play" data-action="play" data-game-id="${g.id}">开始游戏 <span class="button-key">A</span></button><button class="secondary-button" id="favorite" data-action="favorite" data-game-id="${g.id}" aria-pressed="${favorited(g.id)}">${favorited(g.id)?'★ 已收藏':'☆ 收藏'} <span class="button-key">Y</span></button></div><p class="last-session">返回后，继续停留在当前游戏。</p></div></div>`}
const sections=[['library','游戏库'],['emulators','模拟器'],['appearance','外观'],['input','输入'],['video','视频预览'],['performance','性能']];
function settingsBody(){switch(state.section){case'library':return `<h2>游戏库</h2><p>将掌机或 SD 卡中的 ROM 文件夹加入游戏库。</p><div class="setting-row"><div><strong>Game Boy Advance</strong><small>${state.empty?'尚无游戏': '5 款示例游戏'}</small></div><span class="mono cyan">GBA</span></div><div class="actions"><button class="primary-button" id="settings-folder" data-action="folder-info">添加 ROM 文件夹 <span>+</span></button></div><p class="inline-note">此交互初稿无法访问设备目录。</p>`;case'emulators':return `<h2>模拟器</h2><p>为 GBA 选择外部模拟器，启动后可返回原来的游戏位置。</p><div class="setting-row"><div><strong>GBA 默认模拟器</strong><small>尚未配置</small></div><span class="muted">—</span></div><div class="actions"><button class="secondary-button" id="configure-emulator" data-action="emulator-info">配置模拟器</button></div>`;case'appearance':return `<h2>外观</h2><p>清晰的焦点与紧凑的游戏书架。</p><div class="setting-row"><div><strong>霓虹主题</strong><small>RiftDeck / Neon</small></div><span class="yellow">当前</span></div><button class="setting-row" id="reduce-motion" data-action="motion" aria-pressed="${state.reduced}"><div><strong>降低动态效果</strong><small>${state.reduced?'已关闭界面过渡':'使用短暂的按键反馈'}</small></div><span class="switch" aria-hidden="true"></span></button>`;case'input':return `<h2>输入</h2><p>方向键移动焦点。键盘也可以完整操作。</p><dl class="mapping"><dt>A / Enter</dt><dd>确认</dd><dt>B / Esc</dt><dd>返回</dd><dt>X / Y</dt><dd>详情 / 收藏</dd><dt>Q / E</dt><dd>上一个 / 下一个分类</dd><dt>M</dt><dd>设置菜单</dd></dl><p class="inline-note">按键重映射将在原生应用中配置。</p>`;case'video':return `<h2>视频预览</h2><p>停留在游戏上片刻后再播放预览，移动焦点即停止。</p><div class="setting-row"><div><strong>游戏预览</strong><small>示例库没有视频素材</small></div><span class="muted">未启用</span></div><p class="inline-note">本初稿展示封面与信息，不播放示例视频。</p>`;case'performance':return `<h2>性能</h2><p>输入响应优先，保持界面轻量。</p><div class="setting-row"><div><strong>封面显示</strong><small>仅渲染当前页面内容</small></div><span class="cyan">静态</span></div><p class="inline-note">缓存管理与设备性能选项在原生应用中提供。</p>`}}
function settings(){return `${heading('设置','SETTINGS / MAKE IT YOURS')}<div class="settings-layout"><nav class="settings-tabs" aria-label="设置分类">${sections.map(([key,title])=>`<button id="section-${key}" data-action="section" data-section="${key}" aria-pressed="${state.section===key}">${title}</button>`).join('')}</nav><section class="settings-content" aria-label="${sections.find(s=>s[0]===state.section)[1]}">${settingsBody()}</section></div>`}
function focusElement(el){if(!el)return;el.focus({preventScroll:true});const rect=el.getBoundingClientRect(),bounds=main.getBoundingClientRect();if(main.contains(el)){if(rect.bottom>bounds.bottom-12)main.scrollTop+=rect.bottom-bounds.bottom+18;else if(rect.top<bounds.top+12)main.scrollTop-=bounds.top-rect.top+18}}
function render(preferred){document.body.dataset.screen=state.screen;document.body.classList.toggle('reduced',state.reduced);document.querySelectorAll('[data-action=nav]').forEach(b=>{if(b.dataset.target===state.screen||(state.screen==='detail'&&b.dataset.target==='library'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.getElementById('rail-count').textContent=state.empty?'00 GAMES':'05 GAMES';document.getElementById('empty-toggle').setAttribute('aria-pressed',state.empty);main.innerHTML=`<section class="screen">${state.empty&&state.screen!=='settings'?emptyScreen():({home,library,detail,settings}[state.screen]())}</section>`;main.scrollTop=Number(state.scrollByPage[state.screen])||0;const first=state.empty&&state.screen!=='settings'?'add-folder':state.screen==='home'?'home-game-1':state.screen==='library'?`game-${state.selected}`:state.screen==='detail'?'play':`section-${state.section}`;const target=preferred||state.focusByPage[state.screen]||first;requestAnimationFrame(()=>{focusElement(document.getElementById(target)||document.getElementById(first)||main.querySelector('button'));persist()});persist()}
function openModal(title,text,type='info'){modalReturn=document.activeElement;modal.innerHTML=`<div class="dialog"><div class="eyebrow">RIFTDECK / ${type==='emulator'?'EMULATOR':'LIBRARY'}</div><h2 id="modal-title">${title}</h2><p>${text}</p><div class="actions">${type==='emulator'?'<button class="primary-button" id="modal-primary" data-action="emulator-settings">进入模拟器设置 <span class="button-key">A</span></button>':'<button class="primary-button" id="modal-primary" data-action="close-modal">知道了 <span class="button-key">A</span></button>'}<button class="secondary-button" data-action="close-modal">返回 <span class="button-key">B</span></button></div></div>`;modal.classList.remove('hidden');document.getElementById('app').inert=true;focusElement(document.getElementById('modal-primary'))}
function closeModal(){modal.classList.add('hidden');document.getElementById('app').inert=false;if(modalReturn?.isConnected)focusElement(modalReturn);else focusElement(main.querySelector('button'))}
function toggleFavorite(id){if(state.empty)return;state.favorites=favorited(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];const active=document.activeElement?.id;remember();render(active);notify(favorited(id)?'已加入收藏':'已取消收藏')}
function dispatch(button){const a=button.dataset.action,id=Number(button.dataset.gameId);switch(a){case'nav':go(button.dataset.target);break;case'collection':go('library',{filter:button.dataset.filter});break;case'detail':go('detail',{selected:id});break;case'back':back();break;case'filter':remember();state.filter=button.dataset.filter;state.scrollByPage.library=0;render(button.id||'filter-all');break;case'sort':remember();state.sortAsc=!state.sortAsc;render('sort');break;case'favorite':toggleFavorite(id||state.selected);break;case'play':openModal('尚未配置模拟器','请先为 GBA 配置一个外部模拟器，再启动 '+game().title+'。','emulator');break;case'emulator-settings':closeModal();go('settings',{section:'emulators'});break;case'close-modal':closeModal();break;case'section':remember();state.section=button.dataset.section;render(button.id);break;case'motion':state.reduced=!state.reduced;render('reduce-motion');notify(state.reduced?'已降低动态效果':'已恢复动态效果');break;case'folder':go('settings',{section:'library'});openModal('添加 ROM 文件夹','此交互初稿无法访问设备目录。原生应用将使用 Android 文件夹选择器读取你授权的 ROM 文件夹。');break;case'folder-info':openModal('添加 ROM 文件夹','此交互初稿无法访问设备目录。原生应用将使用 Android 文件夹选择器读取你授权的 ROM 文件夹。');break;case'emulator-info':openModal('配置外部模拟器','此交互初稿无法读取已安装应用。原生应用中可选择模拟器并设置 GBA 启动参数。');break;case'empty':remember();state.empty=!state.empty;state.screen='home';state.history=[];state.focusByPage={};state.scrollByPage={};render();break}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)dispatch(b)});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-game-id]');if(b){state.selected=Number(b.dataset.gameId);persist()}});
function eligible(){return [...(modal.classList.contains('hidden')?document.getElementById('app'):modal).querySelectorAll('button:not([disabled]),input')].filter(e=>e.offsetWidth&&e.offsetHeight&&e.id!=='empty-toggle')}
function move(direction){const current=document.activeElement;
if(modal.classList.contains('hidden')&&state.screen==='settings'){
 const tabs=[...document.querySelectorAll('.settings-tabs button')],i=tabs.indexOf(current);
 if(i>=0&&direction==='right'){focusElement(document.querySelector('.settings-content button'));return}
 if(i>=0&&(direction==='up'||direction==='down')){focusElement(tabs[i+(direction==='up'?-1:1)]);return}
 if(current.closest('.settings-content')&&direction==='left'){focusElement(document.getElementById('section-'+state.section));return}
}
if(modal.classList.contains('hidden')&&current.matches('.game-tile')){
 const grid=current.closest('.library-grid'),cards=[...grid.querySelectorAll('.game-tile')],i=cards.indexOf(current),cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
 const target=direction==='right'?(i%cols<cols-1?cards[i+1]:null):direction==='left'?(i%cols>0?cards[i-1]:document.getElementById('nav-library')):direction==='down'?cards[i+cols]:(i>=cols?cards[i-cols]:document.getElementById('filter-all'));
 focusElement(target);return;
}
const list=eligible();if(!list.includes(current)){focusElement(list[0]);return}const r=current.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;const horizontal=direction==='left'||direction==='right',positive=direction==='right'||direction==='down';let best=null,bestScore=Infinity;for(const candidate of list){if(candidate===current)continue;const c=candidate.getBoundingClientRect(),dx=c.left+c.width/2-x,dy=c.top+c.height/2-y;const major=horizontal?dx:dy,cross=horizontal?dy:dx;if((positive?major:-major)<=3)continue;const overlap=horizontal?Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top):Math.min(r.right,c.right)-Math.max(r.left,c.left);const score=Math.abs(major)+Math.abs(cross)*3+(overlap>0?0:90);if(score<bestScore){best=candidate;bestScore=score}}focusElement(best)}
function cycle(delta){if(state.empty)return;if(state.screen==='settings'){let i=sections.findIndex(s=>s[0]===state.section);state.section=sections[(i+delta+sections.length)%sections.length][0];render('section-'+state.section)}else{const filters=['all','recent','favorites'];const filter=filters[(filters.indexOf(state.filter)+delta+filters.length)%filters.length];go('library',{filter})}}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const key=e.key.toLowerCase();if(e.target.matches('input,textarea,[contenteditable=true]')&&!['escape','arrowup','arrowdown'].includes(key))return;const inModal=!modal.classList.contains('hidden');if(key==='tab'&&inModal){e.preventDefault();const nodes=eligible(),index=nodes.indexOf(document.activeElement);focusElement(nodes[(index+(e.shiftKey?-1:1)+nodes.length)%nodes.length]);return}if(['arrowup','arrowdown','arrowleft','arrowright'].includes(key)){e.preventDefault();move(key.slice(5));return}if(key==='escape'||key==='b'){e.preventDefault();if(!e.repeat)back();return}if(key==='enter'||key==='a'){e.preventDefault();if(!e.repeat&&document.activeElement?.matches('button'))document.activeElement.click();return}if(inModal)return;if(key==='x'&&!state.empty){e.preventDefault();if(!e.repeat)go('detail',{selected:state.selected});return}if(key==='y'){e.preventDefault();if(!e.repeat)toggleFavorite(state.selected);return}if(key==='q'||key==='e'){e.preventDefault();if(!e.repeat)cycle(key==='q'?-1:1);return}if(key==='m'){e.preventDefault();if(!e.repeat)go('settings');return}});
window.addEventListener('beforeunload',remember);
window.addEventListener('error',()=>notify('页面遇到问题，请刷新后重试。'));
document.getElementById('brand-logo').src=data.logo;
render();window.__ready=true;
</script></body></html>
