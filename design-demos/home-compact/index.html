<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiftDeck 紧凑主页</title><style>*{box-sizing:border-box}body{margin:0;background:#101415;color:#eef4f3;font:16px "PingFang SC",sans-serif}header{height:76px;display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #344344}strong{margin-right:auto}button{font:inherit;color:inherit;background:#182122;border:1px solid #536263;padding:12px 20px;cursor:pointer}button[aria-selected=true]{border-color:#e7ff4f;color:#e7ff4f}iframe{width:100%;height:calc(100vh - 76px);border:0}button:focus-visible{outline:3px solid #e7ff4f}</style><header><strong>紧凑主页 · 三版比较</strong><button aria-selected="true" data-page="A">A 七行列表</button><button aria-selected="false" data-page="B">B 八项双列</button><button aria-selected="false" data-page="C">C 十项封面</button></header><iframe src="A.html" title="主页布局预览"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelector('iframe').src=b.dataset.page+'.html'})</script></html>
