const sections=['library','emulators','appearance','input','video','performance'];
const sectionNames={library:'游戏库',emulators:'模拟器',appearance:'外观',input:'输入',video:'视频预览',performance:'性能'};
const labels={home:'首页',library:'游戏库',detail:'游戏详情',settings:'设置'};
const state={screen:'home',selected:1,filter:'all',reverse:false,empty:false,section:'library',reduced:false,focus:{},scroll:{}};
try{const saved=JSON.parse(localStorage.getItem('riftdeck-c-v1')||'null');if(saved&&typeof saved==='object'){if(games.some(g=>g.id===saved.selected))state.selected=saved.selected;if(['all','favorites','recent'].includes(saved.filter))state.filter=saved.filter;state.reverse=saved.reverse===true;state.reduced=saved.reduced===true;state.empty=saved.empty===true;if(sections.includes(saved.section))state.section=saved.section;if(Array.isArray(saved.favorites))games.forEach(g=>g.favorite=saved.favorites.includes(g.id))}}catch(_){/* Storage is optional, including blocked or corrupted localStorage. */}
let history=[],modalReturn=null,toastTimer;
const $=id=>document.getElementById(id);
const current=()=>games.find(g=>g.id===state.selected)||games[0];
const countFavorite=()=>games.filter(g=>g.favorite).length;
const time=g=>{const m=Math.floor(g.playTimeSeconds/60),h=Math.floor(m/60);return h?`${h} 小时 ${m%60} 分`:`${m} 分`};
const key=s=>`<span class="key" aria-hidden="true">${s}</span>`;
const btn=(action,content,classes='',id='',extra='')=>`<button type="button" class="${classes}" data-action="${action}" ${id?`id="${id}"`:''} ${extra}>${content}</button>`;
function persist(){try{localStorage.setItem('riftdeck-c-v1',JSON.stringify({...state,focus:undefined,scroll:undefined,favorites:games.filter(g=>g.favorite).map(g=>g.id)}))}catch(_){}}
function visibleGames(){let list=state.empty?[]:games.filter(g=>state.filter==='favorites'?g.favorite:state.filter==='recent'?g.id<=3:true);return [...list].sort((a,b)=>state.filter==='recent'?a.id-b.id:(state.reverse?-1:1)*a.title.localeCompare(b.title))}
function cover(g,interactive=true,detail=false){const inside=`<img src="${g.cover}" alt="${g.title} 示例封面"><span class="cover-label"><span>示例封面</span><span class="mono">GBA</span></span>`;return interactive?btn('detail',inside,'cover-button','hero-game',`data-game-id="${g.id}" aria-label="查看 ${g.title} 游戏详情"`):`<div class="cover-button">${inside}</div>`}
function stats(g,detail=false){return `<dl class="play-stats"><div class="stat"><dt>游玩时长</dt><dd>${time(g)}</dd></div><div class="stat"><dt>上次游玩</dt><dd>${g.lastPlayed}</dd></div>${detail?`<div class="stat"><dt>发行年份</dt><dd class="mono">${g.year}</dd></div><div class="stat"><dt>类型</dt><dd>${g.genre}</dd></div>`:''}</dl>`}
function play(g,id='play'){return btn('launch',`<span>开始游戏</span>${key('A')}`,'play-button',id,`data-game-id="${g.id}"`)}
function favorite(g){return btn('favorite',`${key('Y')} ${g.favorite?'★ 已收藏':'☆ 收藏'}`,'text-action','favorite',`data-game-id="${g.id}" aria-pressed="${g.favorite}"`)}
function heroInfo(g,detail=false){return `<div class="game-info"><div class="game-kicker"><span class="mono">GAME BOY ADVANCE</span>${detail?'':`<span>${g.genre} / ${g.year}</span>`}${g.favorite?'<span class="star" aria-label="已收藏">★</span>':''}</div><h2 class="game-title">${g.title}</h2><p class="developer">${g.developer}</p>${stats(g,detail)}${play(g)}<div class="minor-actions">${detail?btn('back',`${key('B')} 返回`,'text-action','detail-back'):btn('detail',`${key('X')} 游戏详情`,'text-action','details',`data-game-id="${g.id}"`)}${favorite(g)}</div></div>`}
function renderHome(){if(state.empty)return empty();const g=current();return `<section class="page home-page"><div class="heading-row"><div><p class="eyebrow">YOUR NEXT SESSION</p><h1>继续游玩</h1></div><p class="heading-meta">当前平台 <b>GBA</b> <span class="muted">／</span> ${games.length} 款游戏</p></div><div class="hero"><div class="art-stage"><div class="stage-cross" aria-hidden="true"></div>${cover(g)}<div class="stage-controls">${btn('previous','‹','step','previous','aria-label="上一款游戏" '+(g.id===1?'disabled':''))}<div class="stage-count"><b>0${g.id}</b> / 0${games.length}</div>${btn('next','›','step','next','aria-label="下一款游戏" '+(g.id===5?'disabled':''))}</div></div>${heroInfo(g)}</div><div class="shortcuts">${btn('recent','<span class="shortcut-label">最近游玩<small>回到熟悉的游戏</small></span><strong>03</strong>','shortcut','recent')}${btn('favorites',`<span class="shortcut-label">我的收藏<small>留给下一次的期待</small></span><strong>0${countFavorite()}</strong>`,'shortcut','favorites')}${btn('all','<span class="shortcut-label">全部游戏<small>浏览 GBA 游戏库</small></span><strong>05</strong>','shortcut','all')}</div></section>`}
function preview(){const g=current();return `<div class="preview-art"><img src="${g.cover}" alt="${g.title} 示例封面"><div class="cover-label"><span>示例封面</span><span class="mono">GBA</span></div></div><div class="preview-heading"><h2>${g.title}</h2><p>${g.genre} <span class="muted">/</span> ${g.year} <span class="muted">/</span> ${time(g)}</p></div>${play(g,'preview-play')}`}
function renderLibrary(){if(state.empty)return empty();let list=visibleGames();if(list.length&&!list.some(g=>g.id===state.selected))state.selected=list[0].id;return `<section class="page library-page"><div class="heading-row"><div><p class="eyebrow">CHOOSE YOUR GAME</p><h1>GBA 游戏库</h1></div><span class="heading-meta">${list.length} 款游戏</span></div><div class="library-toolbar"><div class="filter-group">${btn('all',`全部 ${games.length}`,'filter','filter-all',`aria-pressed="${state.filter==='all'}"`)}${btn('favorites',`收藏 ${countFavorite()}`,'filter','filter-favorites',`aria-pressed="${state.filter==='favorites'}"`)}${btn('recent','最近 3','filter','filter-recent',`aria-pressed="${state.filter==='recent'}"`)}</div>${btn('sort',state.filter==='recent'?'按最近游玩':'标题 '+(state.reverse?'Z → A':'A → Z'),'sort','sort',state.filter==='recent'?'disabled':'')}</div><div class="library-body"><div class="game-list" id="game-list" aria-label="游戏列表">${list.length?list.map((g,i)=>btn('detail',`<img src="${g.cover}" alt="${g.title} 示例封面"><span><span class="row-title">${g.title}</span><small>${g.genre} · ${g.year}${g.favorite?' · <span class="star">★ 已收藏</span>':''}</small></span><span class="ordinal">0${i+1}</span>`,`game-row ${g.id===state.selected?'is-selected':''}`,`game-${g.id}`,`data-game-id="${g.id}" data-preview="true" aria-label="${g.title}，${g.genre}${g.favorite?'，已收藏':''}，查看详情"`)).join(''):'<p class="no-match">还没有收藏的游戏。<br>选中游戏后按 Y 收藏。</p>'}</div><div class="library-preview" id="library-preview">${list.length?preview():btn('all','浏览全部游戏','secondary-button','browse-all')}</div></div></section>`}
function renderDetail(){if(state.empty)return empty();const g=current();return `<section class="page detail-page"><div class="heading-row"><div><p class="eyebrow">READY WHEN YOU ARE</p><h1>游戏详情</h1></div>${btn('back','← 返回','back-action','top-back')}</div><div class="hero"><div class="art-stage"><div class="stage-cross" aria-hidden="true"></div>${cover(g,false,true)}</div>${heroInfo(g,true)}</div><div class="detail-bottom"><span>GBA <span class="muted">/</span> ${g.title}</span><span>启动后仍会记住你的选择</span></div></section>`}
function settingsPanel(){const s=state.section;let content='';if(s==='library')content=`<p>管理 ROM 文件夹，让游戏留在熟悉的位置。</p><div class="setting-row"><div><h3>ROM 文件夹</h3><p>尚未添加设备目录</p></div><span class="mono muted">0</span></div>${btn('folder','添加 ROM 文件夹 ↗','secondary-button','folder')}`;if(s==='emulators')content=`<p>为 GBA 选择启动方式。</p><div class="setting-row"><div><h3>默认模拟器</h3><p>尚未配置模拟器</p></div><span class="cyan">—</span></div>${btn('emulator-info','配置模拟器 ↗','secondary-button','configure-emulator')}`;if(s==='appearance')content=`<p>清晰的焦点，克制的动态效果。</p><div class="setting-row"><div><h3>降低动态效果</h3><p>关闭此原型中的过渡动画</p></div>${btn('reduce',state.reduced?'已开启':'已关闭','switch','reduce',`aria-pressed="${state.reduced}"`)}</div><div class="setting-row"><div><h3>主题</h3><p>Neon · 沿用 RiftDeck 品牌色</p></div><span class="yellow">●</span></div>`;if(s==='input')content=`<p>键盘可直接体验手柄操作逻辑。</p><div class="map"><div>${key('↑↓←→')}移动焦点</div><div>${key('A')}确认</div><div>${key('B')}返回</div><div>${key('X')}详情</div><div>${key('Y')}收藏</div><div>${key('Q/E')}切换分类</div><div>${key('M')}设置</div><div>${key('Enter')}确认</div></div>`;if(s==='video')content=`<p>专注浏览，预览只在需要时出现。</p><div class="setting-row"><div><h3>游戏视频</h3><p>当前示例未提供视频素材</p></div><span class="muted">未启用</span></div>`;if(s==='performance')content=`<p>响应速度优先于视觉特效。</p><div class="setting-row"><div><h3>性能状态</h3><p>HTML 初稿不读取设备性能数据。<br>帧率与输入延迟需在 Android 真机测量。</p></div></div>`;return `<div class="section-tag">PREFERENCES / ${String(sections.indexOf(s)+1).padStart(2,'0')}</div><h2>${sectionNames[s]}</h2>${content}`}
function renderSettings(){return `<section class="page settings-page"><div class="heading-row"><div><p class="eyebrow">MAKE IT YOURS</p><h1>设置</h1></div>${btn('back','← 返回','back-action','settings-back')}</div><div class="settings-body"><div class="settings-list" aria-label="设置分类">${sections.map(s=>btn('section',sectionNames[s],'settings-tab',`section-${s}`,`data-section="${s}" aria-current="${state.section===s}"`)).join('')}</div><div class="settings-panel" id="settings-panel">${settingsPanel()}</div></div></section>`}
function empty(){return `<section class="page empty-page"><div class="empty-art" aria-hidden="true"><span>+</span></div><p class="eyebrow">YOUR LIBRARY STARTS HERE</p><h1>暂无游戏</h1><p>添加 ROM 文件夹，开始你的 GBA 收藏。</p>${btn('empty-folder',`<span>添加 ROM 文件夹</span>${key('A')}`,'play-button','empty-folder')}${btn('restore','恢复示例游戏','text-action','restore')}</section>`}
function render(focusId){document.body.dataset.screen=state.screen;document.body.classList.toggle('reduced',state.reduced);const ids=['home','library','detail','settings'];$('app').innerHTML=`<aside class="rail"><div class="brand"><img src="${source.logo}" alt="RiftDeck"><div class="brand-name">RIFT<br>DECK</div></div><nav class="rail-nav" aria-label="主要页面">${ids.map((s,i)=>btn('navigate',`<span class="idx">0${i+1}</span><span>${labels[s]==='游戏详情'?'详情':labels[s]}</span>`,'nav-item',`nav-${s}`,`data-page="${s}" ${state.screen===s?'aria-current="page"':''}`)).join('')}</nav><div class="rail-bottom"><div class="platform-line"></div><div class="gba">GBA</div><div class="platform-caption">GAME BOY<br>ADVANCE</div></div></aside><div class="workspace"><header class="topbar"><div class="crumb"><span class="page-index">0${ids.indexOf(state.screen)+1}</span><span>RIFTDECK</span><span class="slash">/</span><span>${labels[state.screen]}</span></div><div class="review-tools"><span class="review-tag">C · 聚焦舞台</span>${btn('empty',state.empty?'示例库':'空库','quiet-button','toggle-empty')}${btn('about','初稿说明','quiet-button','about')}</div></header><main id="main">${state.screen==='home'?renderHome():state.screen==='library'?renderLibrary():state.screen==='detail'?renderDetail():renderSettings()}</main><footer class="hints"><div class="hint-group"><span class="hint">${key('A')}确认</span><span class="hint">${key('B')}返回</span><span class="hint">${key('X')}详情</span><span class="hint">${key('Y')}收藏</span><span class="hint hint-shoulder">${key('L1/R1')}分类</span></div><span class="input-label">↑ ↓ ← → / ENTER</span></footer></div>`;persist();const preferred=focusId||state.focus[state.screen]||(state.empty&&state.screen!=='settings'?'empty-folder':state.screen==='home'?'hero-game':state.screen==='library'?`game-${state.selected}`:state.screen==='detail'?'play':`section-${state.section}`);requestAnimationFrame(()=>{focusElement($(preferred)||$('main').querySelector('button:not(:disabled)'));$('main').scrollTop=state.scroll[state.screen]||0;window.__ready=true})}
function focusElement(el){if(!el||el.disabled)return;el.focus({preventScroll:true});const container=el.closest('.game-list')||el.closest('main');if(container){const c=container.getBoundingClientRect(),r=el.getBoundingClientRect();if(r.top<c.top+5)container.scrollTop-=c.top-r.top+7;else if(r.bottom>c.bottom-5)container.scrollTop+=r.bottom-c.bottom+7}}
function remember(){state.focus[state.screen]=document.activeElement?.id||state.focus[state.screen];state.scroll[state.screen]=$('main')?.scrollTop||0}
function go(screen,focus){if(screen===state.screen){render(focus);return}remember();history.push({screen:state.screen,selected:state.selected,focus:state.focus[state.screen]});state.screen=screen;render(focus)}
function back(){if($('dialog').open){closeModal();return}const previous=history.pop();if(previous){state.screen=previous.screen;state.selected=previous.selected;render(previous.focus)}else if(state.screen!=='home'){state.screen='home';render()}else notify('已经在首页')}
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2000)}
function openModal(title,message,actions=[['close','返回']]){modalReturn=document.activeElement?.id;$('dialog').innerHTML=`<div class="dialog-body"><p class="eyebrow">RIFTDECK</p><h2 id="dialog-title">${title}</h2><p>${message}</p><div class="dialog-actions">${actions.map((a,i)=>btn(a[0],a[1],i===0?'dialog-primary':'',`dialog-${i}`)).join('')}</div></div>`;$('dialog').showModal();focusElement($('dialog-0'))}
function closeModal(){$('dialog').close();focusElement($(modalReturn)||$('main').querySelector('button'))}
function setFilter(filter){remember();state.filter=filter;if(state.screen!=='library')go('library',`filter-${filter}`);else render(`filter-${filter}`)}
function toggleFavorite(){if(state.empty)return;const g=current(),focus=document.activeElement?.id;g.favorite=!g.favorite;notify(g.favorite?`已收藏 ${g.title}`:`已取消收藏 ${g.title}`);render(focus)}
function action(actionName,target){if(target?.dataset.gameId)state.selected=Number(target.dataset.gameId);switch(actionName){case'navigate':go(target.dataset.page);break;case'detail':if(!state.empty)go('detail','play');break;case'back':back();break;case'launch':openModal('尚未配置模拟器','先为 GBA 选择一个模拟器，再开始游戏。此初稿不会启动设备上的应用。',[['open-emulators','前往设置'],['close','返回']]);break;case'favorite':toggleFavorite();break;case'previous':case'next':state.selected=Math.max(1,Math.min(5,state.selected+(actionName==='next'?1:-1)));render('hero-game');break;case'all':setFilter('all');break;case'favorites':setFilter('favorites');break;case'recent':setFilter('recent');break;case'sort':state.reverse=!state.reverse;render('sort');break;case'section':state.section=target.dataset.section;render(target.id);break;case'reduce':state.reduced=!state.reduced;render('reduce');break;case'empty':state.empty=!state.empty;go('home',state.empty?'empty-folder':'hero-game');break;case'restore':state.empty=false;state.selected=1;go('home','hero-game');break;case'empty-folder':state.section='library';go('settings','folder');openModal('添加 ROM 文件夹','此 HTML 交互初稿无法访问设备目录。正式应用将通过 Android 系统文件夹选择器添加 ROM 文件夹。');break;case'folder':openModal('添加 ROM 文件夹','此 HTML 交互初稿无法访问设备目录。正式应用将通过 Android 系统文件夹选择器添加 ROM 文件夹。');break;case'emulator-info':openModal('模拟器配置','这里展示配置入口。选择已安装模拟器与保存启动参数，需要在 Android 应用中完成。');break;case'open-emulators':closeModal();state.section='emulators';go('settings','configure-emulator');break;case'close':closeModal();break;case'about':openModal('C · 聚焦舞台','交互初稿 · 示例数据。五款虚构游戏与示例封面沿用现有项目；无真实 ROM、视频或模拟器连接。<br><br>方向键移动焦点，Enter / A 确认，Escape / B 返回，X 详情，Y 收藏，Q / E 切换分类，M 打开设置。<br><br>形式来自卡带插槽、D-pad 的离散切换与品牌 R 字的切角。');break}persist()}
document.addEventListener('click',e=>{const target=e.target.closest('button[data-action]');if(target&&!target.disabled)action(target.dataset.action,target)});
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset?.preview){state.selected=Number(el.dataset.gameId);document.querySelectorAll('.game-row').forEach(row=>row.classList.toggle('is-selected',row===el));$('library-preview').innerHTML=preview();persist()}if(el.id&&!el.closest('dialog'))state.focus[state.screen]=el.id});
function move(direction){const focused=document.activeElement;
if(!$('dialog').open&&state.screen==='settings'){
 const tabs=[...document.querySelectorAll('.settings-tab')],i=tabs.indexOf(focused);
 if(i>=0&&direction==='ArrowRight'){focusElement(document.querySelector('.settings-panel button'));return}
 if(i>=0&&(direction==='ArrowUp'||direction==='ArrowDown')){focusElement(tabs[i+(direction==='ArrowUp'?-1:1)]);return}
 if(focused.closest('.settings-panel')&&direction==='ArrowLeft'){focusElement($('section-'+state.section));return}
}
if(!$('dialog').open&&focused.matches('.game-row')){
 const rows=[...document.querySelectorAll('.game-row')],i=rows.indexOf(focused);
 const target=direction==='ArrowDown'?rows[i+1]:direction==='ArrowUp'?(rows[i-1]||$('filter-all')):direction==='ArrowRight'?document.querySelector('#library-preview button'):$('nav-library');focusElement(target);return;
}
const scope=$('dialog').open?$('dialog'):$('app'),items=[...scope.querySelectorAll('button:not(:disabled),input')].filter(e=>e.getClientRects().length&&!['about','toggle-empty'].includes(e.id));const active=document.activeElement;if(!items.includes(active)){focusElement(items[0]);return}const r=active.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2,vertical=direction==='ArrowUp'||direction==='ArrowDown',sign=direction==='ArrowUp'||direction==='ArrowLeft'?-1:1;let best=null,score=Infinity;for(const item of items){if(item===active)continue;const q=item.getBoundingClientRect(),dx=q.x+q.width/2-x,dy=q.y+q.height/2-y,primary=(vertical?dy:dx)*sign,secondary=Math.abs(vertical?dx:dy);if(primary<=4)continue;const value=primary+secondary*3;if(value<score){score=value;best=item}}if(best)focusElement(best)}
document.addEventListener('keydown',e=>{const input=e.target.matches('input,textarea,[contenteditable=true]');if(input&&e.key!=='Escape')return;const k=e.key.toLowerCase();if($('dialog').open){if(k==='escape'||k==='b'){e.preventDefault();closeModal()}else if(k==='a'||k==='enter'){e.preventDefault();document.activeElement?.click()}else if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key)}else if(k==='tab'){const list=[...$('dialog').querySelectorAll('button')],index=list.indexOf(document.activeElement);e.preventDefault();focusElement(list[(index+(e.shiftKey?-1:1)+list.length)%list.length])}return}if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key);return}if(k==='a'||k==='enter'){e.preventDefault();document.activeElement?.click()}else if(k==='b'||k==='escape'){e.preventDefault();back()}else if(k==='x'&&!state.empty){e.preventDefault();go('detail','play')}else if(k==='y'){e.preventDefault();toggleFavorite()}else if(k==='m'){e.preventDefault();go('settings')}else if(k==='q'||k==='e'){e.preventDefault();if(state.screen==='settings'){const i=sections.indexOf(state.section);state.section=sections[Math.max(0,Math.min(sections.length-1,i+(k==='e'?1:-1)))];render(`section-${state.section}`)}else{const filters=['all','favorites','recent'],i=filters.indexOf(state.filter);setFilter(filters[Math.max(0,Math.min(2,i+(k==='e'?1:-1)))])}}});
$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
window.addEventListener('error',()=>notify('页面操作未完成，请刷新后重试。'));
render();
</script>
</body></html>
